[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-activation-contract"
version = "1.0.0"
description = "PRISM warehouse-agnostic activation OpenAPI contract (activate + query)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prism_activation_contract = ["py.typed", "openapi.yaml"]
