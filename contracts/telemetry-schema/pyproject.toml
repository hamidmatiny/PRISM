[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-telemetry-schema"
version = "0.1.0"
description = "PRISM sensor-ping and camera-frame-metadata contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prism_telemetry_schema = ["py.typed"]
