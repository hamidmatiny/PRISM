[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-cv-finding-schema"
version = "0.1.0"
description = "PRISM computer-vision defect/anomaly finding contract"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prism_cv_finding_schema = ["py.typed"]
