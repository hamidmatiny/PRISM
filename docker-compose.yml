# PRISM local development stack
# Phase 5: foundation stub + ingestion + cv-service + activation-gateway +
# control-plane; optional lakehouse / LocalStack.
# ADR-001: zero cloud credentials required for `docker compose up`.
#
# Host port range: 9100–9199 (see .cursor/rules/monorepo.mdc)
#
# Optional LocalStack Kinesis:
#   PRISM_INGEST_BACKEND=localstack docker compose --profile localstack up -d --build
# Medallion over *ingestion-written* bronze (same host path .data/):
#   docker compose --profile lakehouse run --rm lakehouse
#
# Data path contract (local-first): host `./.data` == container `/data`
#   /data/bronze              ← ingestion Hive landings (dt=/device=)
#   /data/lakehouse           ← lakehouse silver/gold parquet
#   /data/cv-review-queue     ← low-confidence CV findings (control-plane review)
#   /data/cv-findings         ← published + gold reviewed findings
#   /data/activation          ← warehouse routing registry (Phase 4)
#   /data/control-plane       ← SQLite (local) / app state
# Fixture-only CI path (synthetic bronze, not live ingest):
#   docker compose --profile lakehouse run --rm lakehouse-fixtures

name: prism

services:
  foundation-stub:
    image: nginx:1.27-alpine
    container_name: prism-foundation-stub
    ports:
      - "9199:80"
    volumes:
      - ./examples/foundation-stub:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Phase 10 — OpenTelemetry collector (OTLP HTTP :9106 → file under .data/otel).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: prism-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "9106:4318"
    volumes:
      - ./observability/collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - ./.data/otel:/var/otel

  # Phase 12 — seeded, audited chaos source (ADR-005). Default unused unless
  # PRISM_SOURCE_MODE=scenario on ingestion.
  scenario-engine:
    build:
      context: .
      dockerfile: scenario-engine/Dockerfile
    container_name: prism-scenario-engine
    ports:
      - "9107:9107"
    environment:
      PRISM_DATA_ROOT: /data
      PRISM_SCENARIO_PORT: "9107"
      PRISM_SCENARIO_SEED: ${PRISM_SCENARIO_SEED:-42}
      PRISM_SCENARIO_ID: ${PRISM_SCENARIO_ID:-scn_42}
      PRISM_ASSET_IDS: ${PRISM_ASSET_IDS:-PRISM-AST-001,PRISM-AST-002,PRISM-AST-003}
    volumes:
      - ./.data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9107/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Phase 14 — per-source circuit breaker + incident journal (ADR-005: pause the
  # source, not the whole pipeline).
  incident-engine:
    build:
      context: .
      dockerfile: incident-engine/Dockerfile
    container_name: prism-incident-engine
    ports:
      - "9108:9108"
    environment:
      PRISM_INCIDENT_ENGINE_PORT: "9108"
      PRISM_DATA_ROOT: /data
      OTEL_SERVICE_NAME: incident-engine
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=prism,deployment.environment=local
    depends_on:
      otel-collector:
        condition: service_started
    volumes:
      - ./.data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: prism-ingestion
    ports:
      - "9105:9105"
    environment:
      PRISM_INGEST_BACKEND: ${PRISM_INGEST_BACKEND:-file}
      PRISM_SOURCE_MODE: ${PRISM_SOURCE_MODE:-live}
      PRISM_SCENARIO_URL: ${PRISM_SCENARIO_URL:-http://scenario-engine:9107}
      PRISM_DATA_ROOT: /data
      PRISM_EMIT_RATE: ${PRISM_EMIT_RATE:-2}
      PRISM_FAILURE_RATE: ${PRISM_FAILURE_RATE:-0.05}
      PRISM_DURATION_SECONDS: ${PRISM_DURATION_SECONDS:-0}
      PRISM_INGESTION_PORT: "9105"
      PRISM_SIM_SEED: ${PRISM_SIM_SEED:-42}
      PRISM_INCIDENT_ENGINE_URL: http://incident-engine:9108
      LOCALSTACK_ENDPOINT: ${LOCALSTACK_ENDPOINT:-http://localstack:4566}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OTEL_SERVICE_NAME: ingestion
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=prism,deployment.environment=local
    depends_on:
      otel-collector:
        condition: service_started
      scenario-engine:
        condition: service_started
      incident-engine:
        condition: service_started
    volumes:
      # Bind mount so host dbt/Spark and containers share one bronze zone.
      - ./.data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9105/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Phase 3 — OpenCV + ONNX YOLO-family defect detection (CPU only).
  cv-service:
    build:
      context: .
      dockerfile: cv-service/Dockerfile
    container_name: prism-cv-service
    ports:
      - "9102:9102"
    environment:
      PRISM_CV_SERVICE_PORT: "9102"
      PRISM_DATA_ROOT: /data
      PRISM_CV_CONFIDENCE_THRESHOLD: ${PRISM_CV_CONFIDENCE_THRESHOLD:-0.55}
      PRISM_CV_MODEL_PATH: /app/cv-service/models/yolo_fleet_defects_tiny.onnx
      PRISM_CV_LABELS_PATH: /app/cv-service/models/labels.json
      PRISM_INCIDENT_ENGINE_URL: http://incident-engine:9108
      OTEL_SERVICE_NAME: cv-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=prism,deployment.environment=local
    depends_on:
      otel-collector:
        condition: service_started
      incident-engine:
        condition: service_started
    volumes:
      - ./.data:/data
      - ./cv-service/fixtures:/fixtures:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 25s

  # Phase 4 — Activation gateway (Redshift + Snowflake adapters; embedded mocks).
  activation-gateway:
    build:
      context: .
      dockerfile: activation-gateway/Dockerfile
    container_name: prism-activation-gateway
    ports:
      - "9103:9103"
      - "9110:9110"
      - "9111:9111"
    environment:
      PRISM_ACTIVATION_GATEWAY_PORT: "9103"
      PRISM_ACTIVATION_MODE: mock
      PRISM_ACTIVATION_EMBEDDED_MOCKS: "1"
      PRISM_MOCK_REDSHIFT_URL: http://127.0.0.1:9110
      PRISM_MOCK_SNOWFLAKE_URL: http://127.0.0.1:9111
      PRISM_DATA_ROOT: /data
      PRISM_LAKEHOUSE_ROOT: /data/lakehouse
      PRISM_ACTIVATION_GOLD_ROOT: /data/lakehouse/gold
      PRISM_ACTIVATION_FIXTURE_GOLD: /app/activation-gateway/fixtures/gold
      PRISM_ACTIVATION_ROUTING_PATH: /data/activation/routing.json
      PRISM_CORS_ORIGINS: http://localhost:9101,http://127.0.0.1:9101
      OTEL_SERVICE_NAME: activation-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=prism,deployment.environment=local
    depends_on:
      otel-collector:
        condition: service_started
    volumes:
      - ./.data:/data
      - ./activation-gateway/fixtures:/fixtures:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9103/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 25s

  # Phase 5 — Django control plane (review queue, RBAC, audit).
  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    container_name: prism-control-plane
    ports:
      - "9100:9100"
    environment:
      PRISM_CONTROL_PLANE_PORT: "9100"
      PRISM_DATA_ROOT: /data
      PRISM_CV_REVIEW_PENDING_DIR: /data/cv-review-queue/pending
      PRISM_CV_REVIEW_DECIDED_DIR: /data/cv-review-queue/decided
      PRISM_CV_FINDINGS_GOLD_DIR: /data/lakehouse/gold/cv_findings
      PRISM_CV_FIXTURE_IMAGES_DIR: /cv-fixtures
      PRISM_CORS_ORIGINS: http://localhost:9101,http://127.0.0.1:9101
      PRISM_BOOTSTRAP_PASSWORD: ${PRISM_BOOTSTRAP_PASSWORD:-prism-local-dev}
      DJANGO_DEBUG: "0"
      # Include compose DNS name so ai-copilot / cockpit proxies are not DisallowedHost 400s.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,control-plane
      # Prefer PRISM_DATABASE_URL so a host DATABASE_URL (pytest) cannot leak a bad path.
      # Local default: SQLite under the bind-mounted .data volume (Postgres via PRISM_DATABASE_URL).
      DATABASE_URL: ${PRISM_DATABASE_URL:-sqlite:////data/control-plane/db.sqlite3}
      PRISM_Q_SYNC: "0"
      OTEL_SERVICE_NAME: control-plane
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=prism,deployment.environment=local
    depends_on:
      otel-collector:
        condition: service_started
    volumes:
      - ./.data:/data
      - ./cv-service/fixtures/images:/cv-fixtures:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 35s

  # Phase 9 — tool-grounded Ask PRISM copilot (ADR-004; no paid LLM).
  ai-copilot:
    build:
      context: .
      dockerfile: ai-copilot/Dockerfile
    container_name: prism-ai-copilot
    ports:
      - "9104:9104"
    environment:
      PRISM_AI_COPILOT_PORT: "9104"
      PRISM_ACTIVATION_URL: http://activation-gateway:9103
      PRISM_CONTROL_PLANE_URL: http://control-plane:9100
      PRISM_DATA_ROOT: /data
      PRISM_CV_FINDINGS_GOLD_DIR: /data/lakehouse/gold/cv_findings
      PRISM_CORS_ORIGINS: http://localhost:9101,http://127.0.0.1:9101
      OTEL_SERVICE_NAME: ai-copilot
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=prism,deployment.environment=local
    volumes:
      - ./.data:/data
    depends_on:
      otel-collector:
        condition: service_started
      control-plane:
        condition: service_healthy
      activation-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9104/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Phase 8 — Vue digital-twin cockpit (dev server; proxies to control-plane + activation).
  cockpit:
    image: node:22-alpine
    container_name: prism-cockpit
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 9101"]
    ports:
      - "9101:9101"
    environment:
      # Browser uses same-origin /proxy/*; Vite proxies to compose DNS names.
      CONTROL_PLANE_PROXY: http://control-plane:9100
      ACTIVATION_PROXY: http://activation-gateway:9103
      COPILOT_PROXY: http://ai-copilot:9104
    volumes:
      - ./cockpit:/app
      - cockpit_node_modules:/app/node_modules
    depends_on:
      control-plane:
        condition: service_healthy
      activation-gateway:
        condition: service_healthy
      ai-copilot:
        condition: service_healthy

  control-plane-worker:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    container_name: prism-control-plane-worker
    command: ["python", "manage.py", "qcluster"]
    environment:
      PRISM_DATA_ROOT: /data
      PRISM_CV_REVIEW_PENDING_DIR: /data/cv-review-queue/pending
      PRISM_CV_REVIEW_DECIDED_DIR: /data/cv-review-queue/decided
      PRISM_CV_FINDINGS_GOLD_DIR: /data/lakehouse/gold/cv_findings
      DATABASE_URL: ${PRISM_DATABASE_URL:-sqlite:////data/control-plane/db.sqlite3}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,control-plane
      PRISM_Q_SYNC: "0"
    volumes:
      - ./.data:/data
    depends_on:
      control-plane:
        condition: service_healthy
    # qcluster does not serve HTTP — do not inherit the API healthcheck.
    healthcheck:
      disable: true

  # Phase 2 — Spark local medallion over ingestion-written bronze at /data/bronze.
  lakehouse:
    profiles: ["lakehouse"]
    build:
      context: .
      dockerfile: lakehouse/Dockerfile
    container_name: prism-lakehouse
    depends_on:
      ingestion:
        condition: service_healthy
    volumes:
      - ./.data:/data
    environment:
      PRISM_BRONZE_ROOT: /data/bronze
      PRISM_WAREHOUSE_ROOT: /data/lakehouse
    command:
      [
        "python",
        "-m",
        "prism_lakehouse",
        "--bronze-root",
        "/data/bronze",
        "--warehouse-root",
        "/data/lakehouse",
      ]

  # Synthetic bronze only — CI / offline; does NOT prove ingest→lakehouse wiring.
  lakehouse-fixtures:
    profiles: ["lakehouse"]
    build:
      context: .
      dockerfile: lakehouse/Dockerfile
    container_name: prism-lakehouse-fixtures
    volumes:
      - ./lakehouse/fixtures/bronze:/data/bronze:ro
      - ./.data/lakehouse-from-fixtures:/data/lakehouse
    command:
      [
        "python",
        "-m",
        "prism_lakehouse",
        "--bronze-root",
        "/data/bronze",
        "--warehouse-root",
        "/data/lakehouse",
      ]

  localstack:
    profiles: ["localstack"]
    image: localstack/localstack:4.3
    container_name: prism-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: kinesis,s3
      DEBUG: "0"
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  localstack-data:
  cockpit_node_modules:
