# PRISM local development stack
# Phase 2: foundation stub + ingestion + optional lakehouse medallion job.
# ADR-001: zero cloud credentials required for `docker compose up`.
#
# Host port range: 9100–9199 (see .cursor/rules/monorepo.mdc)
#
# Optional LocalStack Kinesis:
#   PRISM_INGEST_BACKEND=localstack docker compose --profile localstack up
# One-shot lakehouse transform (Spark local in container):
#   docker compose --profile lakehouse run --rm lakehouse

name: prism

services:
  foundation-stub:
    image: nginx:1.27-alpine
    container_name: prism-foundation-stub
    ports:
      - "9199:80"
    volumes:
      - ./examples/foundation-stub:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: prism-ingestion
    ports:
      - "9105:9105"
    environment:
      PRISM_INGEST_BACKEND: ${PRISM_INGEST_BACKEND:-file}
      PRISM_DATA_ROOT: /data
      PRISM_EMIT_RATE: ${PRISM_EMIT_RATE:-2}
      PRISM_FAILURE_RATE: ${PRISM_FAILURE_RATE:-0.05}
      PRISM_DURATION_SECONDS: ${PRISM_DURATION_SECONDS:-0}
      PRISM_INGESTION_PORT: "9105"
      PRISM_SIM_SEED: ${PRISM_SIM_SEED:-42}
      LOCALSTACK_ENDPOINT: ${LOCALSTACK_ENDPOINT:-http://localstack:4566}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - prism-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9105/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Phase 2 — Spark local medallion over bronze in the shared volume.
  lakehouse:
    profiles: ["lakehouse"]
    build:
      context: .
      dockerfile: lakehouse/Dockerfile
    container_name: prism-lakehouse
    depends_on:
      ingestion:
        condition: service_healthy
    volumes:
      - prism-data:/data
    environment:
      PRISM_BRONZE_ROOT: /data/bronze
      PRISM_WAREHOUSE_ROOT: /data/lakehouse

  # Fixture-based medallion (no dependency on live ingestion data).
  lakehouse-fixtures:
    profiles: ["lakehouse"]
    build:
      context: .
      dockerfile: lakehouse/Dockerfile
    container_name: prism-lakehouse-fixtures
    volumes:
      - ./lakehouse/fixtures/bronze:/data/bronze:ro
      - ./.data/lakehouse:/data/lakehouse
    command:
      [
        "python",
        "-m",
        "prism_lakehouse",
        "--bronze-root",
        "/data/bronze",
        "--warehouse-root",
        "/data/lakehouse",
      ]

  localstack:
    profiles: ["localstack"]
    image: localstack/localstack:4.3
    container_name: prism-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: kinesis,s3
      DEBUG: "0"
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  prism-data:
  localstack-data:
