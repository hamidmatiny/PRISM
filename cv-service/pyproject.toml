[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-cv-service"
version = "0.1.0"
description = "PRISM computer-vision defect detection (OpenCV + ONNX YOLO-family, CPU)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "prism-cv-finding-schema",
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.17",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "onnx>=1.16",
  "httpx>=0.27",
]

[project.scripts]
prism-cv-service = "prism_cv_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prism_cv_service = ["py.typed"]
