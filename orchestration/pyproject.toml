[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-orchestration"
version = "0.17.0"
description = "PRISM Dagster asset-graph orchestration (Phase 17 / ADR-006)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dagster>=1.8",
  "httpx>=0.27",
  "prism-lakehouse",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
web = ["dagster-webserver>=1.8"]

[project.scripts]
prism-orchestration-materialize = "prism_orchestration.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
