[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-activation-gateway"
version = "0.1.0"
description = "PRISM activation gateway — Redshift + Snowflake adapters behind one contract"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "prism-activation-contract",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
prism-activation-gateway = "prism_activation_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prism_activation_gateway = ["py.typed"]
