# PRISM CI — lint, unit tests, terraform validate / tflint / checkov / plan.
# ADR-001: never terraform apply, never call real cloud / paid APIs / GPU.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install --upgrade pip ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format (check)
        run: ruff format --check .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install packages + test deps
        run: |
          pip install --upgrade pip
          pip install pytest ruff pydantic pyyaml "pyspark>=3.5" "dbt-core>=1.8" "dbt-duckdb>=1.8"
          pip install "onnxruntime>=1.17" "opencv-python-headless>=4.8" "numpy>=1.26" "scipy>=1.11" "fastapi>=0.110" "uvicorn>=0.27" "python-multipart" "httpx>=0.27" "duckdb>=1.0"
          pip install "django>=5.0,<6" "django-ninja>=1.3" "django-q2>=1.6" "dj-database-url>=2.1" "psycopg[binary]>=3.1" pytest-django
          pip install -e contracts/telemetry-schema
          pip install -e contracts/cv-finding-schema
          pip install -e contracts/activation-contract
          pip install -e ingestion
          pip install -e scenario-engine
          pip install -e incident-engine
          pip install -e drift-monitor
          pip install -e lakehouse
          pip install -e cv-service
          pip install -e activation-gateway
          pip install -e control-plane
          pip install -e ai-copilot
          pip install -e observability/otel

      - name: Unity Catalog bootstrap structural validation
        run: |
          python lakehouse/unity_catalog/render_bootstrap.py --check
          python lakehouse/unity_catalog/validate_bootstrap.py

      - name: Run unit tests
        run: pytest -q tests/unit
        # e2e lives in tests/e2e and skips unless PRISM_E2E=1 (see job e2e).

      - name: Spark medallion + dbt build (DuckDB)
        run: |
          python -m prism_lakehouse \
            --bronze-root lakehouse/fixtures/bronze \
            --warehouse-root .data/lakehouse
          cd dbt
          export DBT_PROFILES_DIR="$PWD"
          dbt build --target duckdb
          dbt docs generate --target duckdb

  cockpit:
    name: Cockpit typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json

      - name: Install + typecheck + build
        working-directory: cockpit
        run: |
          npm ci
          npm run typecheck
          npm run build
          node --test src/lib/token.test.mjs

  terraform:
    name: Terraform validate / tflint / checkov
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [aws, azure]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init (no backend)
        working-directory: infra/terraform/${{ matrix.stack }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/terraform/${{ matrix.stack }}
        run: terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: tflint init
        working-directory: infra/terraform/${{ matrix.stack }}
        run: tflint --init

      - name: tflint
        working-directory: infra/terraform/${{ matrix.stack }}
        run: tflint --format compact

      # Pin + invoke checkov exactly like `make checkov-<stack>`.
      # Do NOT pass skip_check here — CLI --skip-check replaces .checkov.yml skip-check entirely.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install checkov (pinned)
        run: |
          VERSION=$(tr -d '[:space:]' < infra/terraform/CHECKOV_VERSION)
          pip install --upgrade pip
          pip install "checkov==${VERSION}"
          checkov --version

      - name: checkov
        run: |
          checkov -d "infra/terraform/${{ matrix.stack }}" \
            --config-file "infra/terraform/${{ matrix.stack }}/.checkov.yml" \
            --framework terraform \
            --compact --quiet

  terraform-aws-plan:
    name: AWS terraform plan (artifact)
    runs-on: ubuntu-latest
    needs: [terraform]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init (local backend only)
        working-directory: infra/terraform/aws
        # Local backend for plan artifact. Never a remote/S3 backend in CI (ADR-001).
        run: terraform init -input=false -reconfigure

      - name: Terraform plan (mock credentials only)
        working-directory: infra/terraform/aws
        env:
          # Documented AWS example keys — never real credentials (ADR-001).
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REGION: us-east-1
        run: |
          set -euo pipefail
          terraform plan -input=false -lock=false -no-color -out=tfplan.binary | tee tfplan.txt
          terraform show -no-color tfplan.binary >> tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: aws-terraform-plan
          path: infra/terraform/aws/tfplan.txt
          if-no-files-found: error
          retention-days: 14

  # Phase 11 — live golden path. Needs every prior gate green first.
  e2e:
    name: Golden-path e2e (compose)
    runs-on: ubuntu-latest
    needs: [lint, test, cockpit, terraform, terraform-aws-plan]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install e2e deps
        run: |
          pip install --upgrade pip
          pip install pytest pytest-django httpx duckdb "pydantic>=2.8" pyyaml
          pip install "django>=5.0,<6" "django-ninja>=1.3" "django-q2>=1.6" "dj-database-url>=2.1"
          pip install -e contracts/telemetry-schema
          pip install -e contracts/cv-finding-schema
          pip install -e contracts/activation-contract
          pip install -e ingestion
          pip install -e scenario-engine
          pip install -e incident-engine
          pip install -e cv-service
          pip install -e activation-gateway
          pip install -e control-plane
          pip install -e ai-copilot

      - name: Demo stack up + seed
        env:
          # Cold CI image pulls can exceed the local 5-minute operator budget.
          DEMO_DEADLINE_SECONDS: "600"
        run: make demo

      - name: Golden-path pytest
        env:
          PRISM_E2E: "1"
          DJANGO_SETTINGS_MODULE: prism_control.settings
        run: pytest -q tests/e2e -m e2e

      - name: Compose diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.demo.yml ps
          docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --tail=80
