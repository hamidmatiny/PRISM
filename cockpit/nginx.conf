server {
  listen 9101;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Production-shaped proxy to sibling compose services.
  location /proxy/control/ {
    proxy_pass http://control-plane:9100/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location /proxy/activation/ {
    proxy_pass http://activation-gateway:9103/;
    proxy_set_header Host $host;
  }
}
