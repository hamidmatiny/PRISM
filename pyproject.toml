[project]
name = "prism"
version = "0.1.0"
description = "PRISM — Visual Fleet Intelligence & Multi-Warehouse Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

# Monorepo root is not a single installable package; tools only.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
DJANGO_SETTINGS_MODULE = "prism_control.settings"
markers = [
  "e2e: live docker-compose golden-path (requires PRISM_E2E=1)",
]
pythonpath = [
  ".",
  "contracts/telemetry-schema/src",
  "contracts/cv-finding-schema/src",
  "contracts/activation-contract/src",
  "ingestion/src",
  "scenario-engine/src",
  "incident-engine/src",
  "drift-monitor/src",
  "orchestration/src",
  "lakehouse/src",
  "cv-service/src",
  "activation-gateway/src",
  "ai-copilot/src",
  "control-plane",
  "observability/otel/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".terraform",
  "node_modules",
  "dbt/target",
  "dbt/dbt_packages",
  "lakehouse/lakeflow/medallion_notebook.py",
  "infra/terraform/azure/modules/replication/notebooks",
  "**/migrations/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
  "prism_telemetry_schema",
  "prism_cv_finding_schema",
  "prism_activation_contract",
  "prism_ingestion",
  "prism_scenario_engine",
  "prism_incident_engine",
  "prism_drift_monitor",
  "prism_orchestration",
  "prism_lakehouse",
  "prism_cv_service",
  "prism_activation_gateway",
  "prism_ai_copilot",
  "prism_otel",
  "prism_control",
  "fleet",
  "review",
  "audit",
]
