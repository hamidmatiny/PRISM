[project]
name = "prism"
version = "0.1.0"
description = "PRISM — Visual Fleet Intelligence & Multi-Warehouse Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

# Monorepo root is not a single installable package; tools only.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = [
  ".",
  "contracts/telemetry-schema/src",
  "contracts/cv-finding-schema/src",
  "contracts/activation-contract/src",
  "ingestion/src",
  "lakehouse/src",
  "cv-service/src",
  "activation-gateway/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".terraform",
  "node_modules",
  "dbt/target",
  "dbt/dbt_packages",
  "lakehouse/lakeflow/medallion_notebook.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
  "prism_telemetry_schema",
  "prism_cv_finding_schema",
  "prism_activation_contract",
  "prism_ingestion",
  "prism_lakehouse",
  "prism_cv_service",
  "prism_activation_gateway",
]
